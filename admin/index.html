<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Панель управления · Bull Bike</title>
<link rel="icon" href="../favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/admin.css" />
</head>
<body>

<!-- ===== Экран входа ===== -->
<div id="loginView" class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-logo">
      <img src="../images/logo-nav.png" alt="Bull Bike" onerror="this.style.display='none'" />
      <b>Bull Bike</b>
    </div>
    <p class="login-sub">Панель управления сайтом — войдите по логину и паролю</p>
    <div id="loginErr" class="login-err hidden"></div>
    <div class="fld">
      <label for="login">Логин</label>
      <input class="inp" type="text" id="login" name="username" autocomplete="username" required />
    </div>
    <div class="fld">
      <label for="password">Пароль</label>
      <input class="inp" type="password" id="password" name="password" autocomplete="current-password" required />
    </div>
    <button class="btn btn-block" type="submit" id="loginBtn">Войти</button>
  </form>
</div>

<!-- ===== Приложение ===== -->
<div id="appView" class="app hidden">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <img src="../images/logo-nav.png" alt="" onerror="this.style.display='none'" />
      <b>Bull Bike</b>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="sb-user">
        <span class="sb-ava" id="userAva">A</span>
        <div><div id="userName" style="font-size:13.5px;color:var(--tx)">admin</div><div style="font-size:11.5px">Администратор</div></div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn">Выйти</button>
      <div style="margin-top:12px">Сайт: <a href="../" target="_blank" rel="noopener">открыть ↗</a></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="burger" id="burger" aria-label="Меню">☰</button>
      <h1 id="pageTitle">Главный экран</h1>
      <div class="save-state"><span class="dot" id="stateDot"></span><span id="stateTxt">Всё сохранено</span></div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <div class="savebar" id="savebar">
    <div class="sb-txt">Есть несохранённые изменения <b id="dirtyCount"></b></div>
    <button class="btn btn-ghost btn-sm" id="discardBtn">Отменить</button>
    <button class="btn" id="saveBtn">Сохранить на сайт</button>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
